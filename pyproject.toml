[project]
name = "votcloc-surface-viewer"
version = "0.1.0"
description = "Browser surface viewer for VOTCLOC manual ROI delineation: inflated + pial side by side with heatmap, auto-cluster, atlas and manual label layers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Server for the viewer page (app.py); the 3D view itself runs in the
    # browser (three.js, loaded from jsDelivr).
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy",
    "nibabel",
    "pyyaml",
    # CLI + console output for app.py and the scripts/ helpers.
    "typer>=0.12",
    "rich>=13",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

# This is an app, not a distributable package: tell uv to manage the
# environment/dependencies only and not try to build/install the project
# itself. (No [build-system] table => uv already treats it as virtual; this
# makes the intent explicit.)
[tool.uv]
package = false
