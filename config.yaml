# Config for the manual-delineation helper app.
#
# Where does the data come from? Flip ONE field:
#   data_source: repo  -> read the example data bundled in this repo
#                         (repo_data_dir, resolved next to this config file so
#                         it works right after `git clone`).
#   data_source: disk  -> read a full derivatives tree elsewhere
#                         (disk_data_dir, an absolute path).
#
# Rule for either path: relative -> resolved next to this config file;
# absolute -> used as-is.
data_source: repo
repo_data_dir: example_dataset
disk_data_dir: /bcbl/home/public/Gari/VOTCLOC/main_exp/derivatives

# fs_dir: FreeSurfer subject dir (relative to the chosen data root) — used to
# load the surface geometry (inflated/pial + curvature).
fs_dir: freesurfer-with_t2

# Layer paths below are relative to the chosen data root. In each, "{sub}" is
# replaced with the selected subject; every path is also editable live in the
# app (the box is pre-filled from here).

# Initial selections: subject, hemisphere, and the contrast whose *_score
# heatmap is shown on load.
default_subject: "02"
default_hemi: lh
default_contrast: RWvsAllNotext

# Surfaces shown side by side, left to right (linked cameras). They must share
# vertex indices, which all surfaces of one FreeSurfer hemisphere do.
surfaces: [inflated, pial]

# Layer 1 — heatmap overlays (*.func.gii)
heatmap_dir: autoROI/individual/analysis-27_5ses_VOTC_IMOG_1.5T_real_height0.15/{sub}

# Layer 2 — auto clusters (*_Cluster_*.label)
clusters_dir: autoROI/individual/analysis-27_5ses_VOTC_IMOG_1.5T_real_height0.15/{sub}/labels

# Layer 3 — FreeSurfer / atlas labels and annots shipped with the recon
# (<hemi>.*.label, <hemi>.*.annot). Its sub-folders are offered as layer-4 sources.
atlas_label_dir: freesurfer-with_t2/{sub}/label

# Layer 4 — user-defined manual labels (<hemi>.*.label)
manual_label_dir: freesurfer-with_t2/{sub}/label/tiger_delineation

# Compare page (/compare): layer 4 above is the REFERENCE (top row); this
# folder's labels are the COMPARED ones (bottom row). Both pickable in the page.
compare_label_dir: freesurfer-with_t2/{sub}/label/tiger_ROI_auto


# Labels drawn in the page (Contour / Brush / Erase tabs) are saved to
# <fs_dir>/<sub>/label/<folder>/<hemi>.<name>.label. This is the folder name
# the page starts with; it is editable there. xyz are taken from <hemi>.white.
draw_label_dir: tiger_ROI_auto

# Offered in the "Save to" dropdown (plus every folder the subject already has
# under label/). One per delineation step, so switching is one click:
#   tiger_ROI_auto       ROIs from the auto clusters (e.g. RWvsAllNotext_score)
#   tiger_ROI_manual     ROIs from a t-threshold map (e.g. RWvsAllNotext_mean_raw)
#   tiger_anat_landmark  anatomical landmarks drawn by hand
#   tiger_face_ROI_auto  face ROIs (IOG, pFus, mFus -faces), lh and rh
draw_label_folders: [tiger_ROI_auto, tiger_ROI_manual, tiger_anat_landmark, tiger_face_ROI_auto]

# Label-name suggestions in the "Label name" box, per Save-to folder. A folder
# not listed here suggests the word-ROI names (mFus-words, ...).
# Same names on both hemispheres: lh.FG.label and rh.FG.label (the page's
# Hemisphere switch / header Hemi picks which one is drawn and saved).
draw_label_names:
  tiger_anat_landmark: [FG, IOG, ITG, MFS, PON, OTS, MOG]
  tiger_ROI_auto: [LOC-words, IOG-words, PON-words, pOTS-words, mOTS-words, mFus-words]
  tiger_ROI_manual: [LOC-words, IOG-words, PON-words, pOTS-words, mOTS-words, mFus-words]
  tiger_face_ROI_auto: [IOG-faces, pFus-faces, mFus-faces]
