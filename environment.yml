# Conda / micromamba environment for the surface viewer.
#
#   conda env create -f environment.yml      (or: micromamba create -f environment.yml)
#   conda activate votcloc-surface-viewer
#   python app.py
#
# Derived from pyproject.toml (the source of truth; the maintainer uses uv).
name: votcloc-surface-viewer

channels:
  - conda-forge

dependencies:
  - python>=3.10
  - fastapi>=0.110
  - uvicorn>=0.29
  - numpy
  - nibabel
  - pyyaml
  # CLI + console output for app.py and the scripts/ helpers.
  - typer>=0.12
  - rich>=13
